name: Build & Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_and_push:
    name: Build & Push to DockerHub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Read version
        run: echo "VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build all modules with Maven
        run: |
          mvn -B -ntp clean verify -Pproduction -pl '!e2e-tests'

      - name: Build and scan Docker images
        run: |
          set -euo pipefail
          mkdir -p scan-results
          for module in directory inventory incident main; do
            repository="$module"
            if [[ "$module" == main ]]; then repository=sysadminanywhere; fi
            image="sysadminanywhere/$repository:$VERSION"
            docker build --pull --tag "$image" "./$module"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v trivy-cache:/root/.cache/trivy aquasec/trivy:0.76.2 image \
              --scanners vuln --timeout 15m --no-progress --format json "$image" > "scan-results/$module.json"
          done

      - name: Upload vulnerability scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-image-vulnerabilities
          path: scan-results/

      - name: Publish Docker images
        run: |
          set -euo pipefail
          for repository in directory inventory incident sysadminanywhere; do
            image="sysadminanywhere/$repository"
            docker push "$image:$VERSION"
          done
          for repository in directory inventory incident sysadminanywhere; do
            image="sysadminanywhere/$repository"
            docker tag "$image:$VERSION" "$image:latest"
            docker push "$image:latest"
          done
