help_view.title=Ajuda
help_view.welcome_title=Bem-vindo ao Sysadmin Anywhere
help_view.welcome_text=Use esta página para conhecer as principais áreas da aplicação. Inicie o tour para uma introdução rápida.
help_view.start_tour=Iniciar tour
help_view.navigation_title=Navegação
help_view.dashboard_title=Painel
help_view.dashboard_text=Veja usuários, computadores, grupos, impressoras, contatos e a saúde dos sistemas. Os dados são carregados após a abertura da página; os resultados de saúde e auditoria são mantidos por um minuto. Use Atualizar para obter dados recentes.
help_view.search_title=Pesquisa global
help_view.search_text=Pesquise usuários, computadores, grupos, contatos e impressoras num só lugar. Selecione um resultado para abrir os detalhes.
help_view.management_title=Gestão
help_view.management_text=Gerencie contêineres do diretório, usuários, computadores, grupos, impressoras e contatos.
help_view.incidents_title=Incidentes
help_view.incidents_text=Consulte os incidentes detectados, seus estados e recomendações.
help_view.inventory_title=Inventário
help_view.hardware_inventory_title=Inventário de hardware
help_view.hardware_inventory_text=Consulte os componentes por modelo e veja em quantos computadores cada um foi detetado. Abra um modelo para ver os computadores e as alterações. O histórico começa na primeira análise bem-sucedida após a ativação; não é possível inferir datas anteriores. Falhas de WMI não registam os dispositivos como removidos.
help_view.inventory_text=Consulte o inventário de software e hardware dos computadores gerenciados.
help_view.reports_title=Relatórios
help_view.reports_text=Abra relatórios de usuários, computadores e grupos.
help_view.workflows_title=Tarefas comuns
help_view.users_title=Usuários
help_view.users_text=Use filtros para encontrar utilizadores, clique numa linha para ver detalhes e use Novo ou Importar para adicionar contas. Use as caixas de seleção para seleção múltipla.
help_view.bulk_title=Operações em massa de utilizadores
help_view.bulk_text=Selecione vários utilizadores e use Ativar selecionados ou Desativar selecionados. Cada operação requer confirmação e aparece na auditoria do diretório.
help_view.bulk_directory_title=Operações em massa de objetos do diretório
help_view.bulk_directory_text=Os computadores suportam ativação, desativação e eliminação em massa. Grupos, contactos e impressoras suportam eliminação em massa. Selecione pelas caixas; um clique continua a abrir os detalhes e cada ação requer confirmação.
help_view.bulk_group_title=Associação a grupos em massa
help_view.bulk_group_text=Nas listas de utilizadores e computadores, selecione linhas e use Adicionar selecionados ao grupo ou Remover selecionados do grupo. Escolha o grupo de destino e confirme.
help_view.bulk_move_title=Movimentação em massa entre contentores
help_view.bulk_move_text=Na lista de contentores, selecione objetos suportados, escolha o contentor de destino e confirme. Os tipos de sistema e desconhecidos permanecem protegidos.
help_view.status_title=Indicadores de estado
help_view.status_text=Os ícones azuis indicam utilizadores e computadores ativos. Os ícones cinzentos indicam contas ou computadores desativados.
help_view.computers_title=Computadores
help_view.computers_text=Abra um computador para consultar hardware, software, serviços, processos e desempenho.
help_view.settings_title=Configurações
help_view.settings_text=Altere o tema, o idioma e os valores padrão para novos usuários.
help_view.support_title=Documentação e suporte
help_view.support_text=Encontre instruções detalhadas na documentação ou relate um problema à equipe do projeto.
help_view.documentation=Abrir documentação
help_view.report_issue=Relatar um problema
tour.skip=Ignorar tour
tour.previous=Voltar
tour.next=Próximo
tour.finish=Concluir
tour.step_counter=Etapa {0} de {1}
tour.step.navigation.title=Navegação principal
tour.step.navigation.description=Use esta barra para alternar entre as áreas principais do Sysadmin Anywhere.
tour.step.sections.title=Menu da seção
tour.step.sections.description=O segundo painel mostra as páginas da área selecionada.
tour.step.content.title=Conteúdo da página
tour.step.content.description=O cabeçalho mostra a página atual. Abaixo ficam tabelas, filtros e ações.
tour.step.help.title=Ajuda e tour
tour.step.help.description=Você pode reabrir o tour a qualquer momento em Configurações → Ajuda.

