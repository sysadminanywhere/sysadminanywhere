tour.step.navigation.description=Über diese Leiste wechseln Sie zwischen den Hauptbereichen von Sysadmin Anywhere.
tour.step.sections.title=Bereichsmenü
tour.step.sections.description=Das zweite Menü zeigt die Seiten des ausgewählten Bereichs.
tour.step.content.title=Seiteninhalt
tour.step.content.description=Die Kopfzeile zeigt die aktuelle Seite. Darunter finden Sie Tabellen, Filter und Aktionen.
