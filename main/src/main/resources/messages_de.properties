help_view.title=Hilfe
help_view.welcome_title=Willkommen bei Sysadmin Anywhere
help_view.welcome_text=Auf dieser Seite lernen Sie die wichtigsten Bereiche der Anwendung kennen. Starten Sie die Führung für eine kurze Einführung.
help_view.start_tour=Führung starten
help_view.navigation_title=Navigation
help_view.dashboard_title=Dashboard
help_view.dashboard_text=Zuerst erscheinen Verzeichniszahlen und Verteilungsdiagramme, danach Karten für Domänenzustand, Sicherheit, Konten, Inventar und Lizenzen. Die Karten öffnen Details. Daten werden eine Minute zwischengespeichert; Aktualisieren lädt neue Werte.
help_view.search_title=Globale Suche
help_view.search_text=Benutzer, Computer, Gruppen, Kontakte und Drucker an einer Stelle suchen. Ein Ergebnis öffnet die Detailansicht.
help_view.management_title=Verwaltung
help_view.management_text=Verwalten Sie Verzeichniscontainer, Benutzer, Computer, Gruppen, Drucker und Kontakte.
help_view.incidents_title=Vorfälle
help_view.incidents_text=Erkannte Vorfälle sowie deren Status und Empfehlungen prüfen.
help_view.inventory_title=Inventar
help_view.hardware_inventory_title=Hardwareinventar
help_view.hardware_inventory_text=Komponenten nach Modellname oder Kategorie filtern und dann Suchen oder Zurücksetzen wählen. Die Tabelle zeigt, auf wie vielen Computern jedes Modell gefunden wurde. Ein Modell öffnen, um Computer sowie hinzugefügte, entfernte oder anhand der Seriennummer erkannte ersetzte Geräte zu sehen. Gewöhnliche WMI-Eigenschaftsänderungen sind keine Hardwareereignisse. Der Verlauf beginnt mit dem ersten erfolgreichen Scan nach der Einführung; frühere Installationsdaten lassen sich nicht ableiten. Fehlgeschlagene WMI-Abfragen kennzeichnen Geräte nicht als entfernt.
help_view.inventory_text=Software- und Hardwareinventar verwalteter Computer anzeigen.
help_view.reports_title=Berichte
help_view.reports_text=Berichte zu Benutzern, Computern und Gruppen öffnen.
help_view.workflows_title=Häufige Aufgaben
help_view.users_title=Benutzer
help_view.users_text=Mit Filtern suchen, eine Zeile für Details anklicken und Konten über Neu oder Import hinzufügen. Für die Mehrfachauswahl verwenden Sie die Kontrollkästchen.
help_view.bulk_title=Massenaktionen für Benutzer
help_view.bulk_text=Wählen Sie mehrere Benutzer aus und verwenden Sie Ausgewählte aktivieren oder Ausgewählte deaktivieren. Jede Aktion muss bestätigt werden und erscheint im Verzeichnis-Audit.
help_view.bulk_directory_title=Massenaktionen für Verzeichnisobjekte
help_view.bulk_directory_text=Computer unterstützen Aktivieren, Deaktivieren und Löschen in großen Mengen. Gruppen, Kontakte und Drucker unterstützen Löschen in großen Mengen. Wählen Sie per Kontrollkästchen; ein Klick öffnet weiterhin die Details und jede Aktion muss bestätigt werden.
help_view.bulk_group_title=Massenaktionen für Gruppenmitgliedschaften
help_view.bulk_group_text=Wählen Sie in Benutzer- und Computerlisten Zeilen aus und verwenden Sie Ausgewählte zur Gruppe hinzufügen oder Ausgewählte aus der Gruppe entfernen. Zielgruppe auswählen und bestätigen.
help_view.bulk_move_title=Massenverschiebung zwischen Containern
help_view.bulk_move_text=Wählen Sie unterstützte Objekte in der Containerliste aus, wählen Sie den Zielcontainer und bestätigen Sie. System- und unbekannte Typen bleiben geschützt.
help_view.status_title=Statusanzeigen
help_view.status_text=Blaue Symbole zeigen aktivierte Benutzer und Computer. Graue Symbole zeigen deaktivierte Konten oder Computer.
help_view.computers_title=Computer
help_view.computers_text=Computer öffnen, um Hardware, Software, Dienste, Prozesse und Leistung zu prüfen.
help_view.settings_title=Einstellungen
help_view.settings_text=Farbschema, Sprache und Standardwerte für neue Benutzer ändern.
help_view.support_title=Dokumentation und Support
help_view.support_text=Ausführliche Anleitungen finden Sie in der Dokumentation. Fehler können Sie dem Projektteam melden.
help_view.documentation=Dokumentation öffnen
help_view.report_issue=Fehler melden
