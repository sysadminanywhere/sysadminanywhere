help_view.navigation_title=Navigazione
help_view.dashboard_title=Dashboard
help_view.dashboard_text=Visualizza un riepilogo di utenti, computer, gruppi, stampanti e contatti.
help_view.search_title=Ricerca globale
help_view.search_text=Cerca utenti, computer, gruppi, contatti e stampanti in un unico posto. Seleziona un risultato per aprirne i dettagli.
help_view.management_title=Gestione
help_view.management_text=Gestisci contenitori della directory, utenti, computer, gruppi, stampanti e contatti.
help_view.incidents_title=Incidenti
help_view.incidents_text=Esamina gli incidenti rilevati, il loro stato e le raccomandazioni.
help_view.inventory_title=Inventario
help_view.inventory_text=Consulta l’inventario software e hardware dei computer gestiti.
help_view.reports_title=Report
help_view.reports_text=Apri i report relativi a utenti, computer e gruppi.
help_view.workflows_title=Attività comuni
help_view.users_title=Utenti
help_view.users_text=Usa i filtri, fai clic su una riga per i dettagli e aggiungi account con Nuovo o Importa. Usa le caselle per la selezione multipla.
help_view.bulk_title=Operazioni di massa sugli utenti
help_view.bulk_text=Seleziona più utenti e usa Abilita selezionati o Disabilita selezionati. Ogni operazione richiede conferma e viene registrata nell’audit della directory.
help_view.bulk_directory_title=Operazioni di massa sugli oggetti della directory
help_view.bulk_directory_text=Per i computer sono disponibili abilitazione, disabilitazione ed eliminazione di massa. Per gruppi, contatti e stampanti è disponibile l’eliminazione di massa. Seleziona con le caselle; un clic apre ancora i dettagli e ogni azione richiede conferma.
help_view.bulk_group_title=Appartenenza ai gruppi in massa
help_view.bulk_group_text=Nelle liste di utenti e computer seleziona le righe e usa Aggiungi selezionati al gruppo o Rimuovi selezionati dal gruppo. Scegli il gruppo di destinazione e conferma.
help_view.bulk_move_title=Spostamento di massa tra contenitori
help_view.bulk_move_text=Nella lista dei contenitori seleziona gli oggetti supportati, scegli il contenitore di destinazione e conferma. I tipi di sistema e sconosciuti restano protetti.
help_view.status_title=Indicatori di stato
help_view.status_text=Le icone blu indicano utenti e computer abilitati. Le icone grigie indicano account o computer disabilitati.
help_view.computers_title=Computer
help_view.computers_text=Apri un computer per controllare hardware, software, servizi, processi e prestazioni.
help_view.settings_title=Impostazioni
help_view.settings_text=Modifica tema, lingua e valori predefiniti per i nuovi utenti.
help_view.support_title=Documentazione e supporto
help_view.support_text=Consulta la documentazione per istruzioni dettagliate o segnala un problema al team del progetto.
