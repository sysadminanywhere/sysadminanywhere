help_view.change_history_title=История изменений приложения
help_view.change_history_text=Страница «История изменений» записывает изменения, выполненные через приложение, пользователя и снимки состояния «до/после». Журнал хранится в настроенном JSON-файле. Изменения вне приложения доступны только в источнике аудита Active Directory.
