help_view.workflows_title=Частые действия
help_view.users_title=Пользователи
help_view.users_text=Используйте фильтры, нажимайте строку для просмотра деталей, добавляйте пользователей через Создать или Импорт. Для мультивыбора используйте чекбоксы.
help_view.import_users_title=Предпросмотр импорта CSV
help_view.import_users_text=Загрузите CSV, проверьте каждую строку и ошибки валидации, затем импортируйте только корректные строки. Ошибочные строки остаются в таблице для исправления и повторной загрузки.
help_view.bulk_title=Массовые операции с пользователями
help_view.bulk_text=Выберите несколько пользователей в таблице и используйте команды «Включить выбранные» или «Отключить выбранные». Операция требует подтверждения и отражается в аудите каталога.
help_view.bulk_directory_title=Массовые операции с объектами каталога
help_view.bulk_directory_text=Для компьютеров доступны массовое включение, отключение и удаление. Для групп, контактов, принтеров и поддержанных объектов в списке контейнера — массовое удаление. Выбирайте строки чекбоксами; один клик открывает карточку, а каждая операция требует подтверждения.
help_view.bulk_group_title=Массовое членство в группах
help_view.bulk_group_text=В списках пользователей и компьютеров выберите строки чекбоксами и используйте «Добавить выбранные в группу» или «Удалить выбранные из группы». Выберите целевую группу и подтвердите операцию. Результат содержит успешные и неуспешные объекты.
help_view.bulk_move_title=Массовый перенос между контейнерами
help_view.bulk_move_text=В списке контейнера выберите поддержанные объекты чекбоксами, укажите контейнер назначения и подтвердите операцию. Системные и неизвестные типы остаются защищёнными.
help_view.audit_title=История аудита
help_view.audit_text=На странице «Аудит» можно фильтровать изменения по имени объекта, DN, действию и периоду. Нажмите строку для просмотра доступных LDAP-метаданных. Этот источник Active Directory не содержит пользователя приложения и исторические значения «до/после».
help_view.status_title=Индикаторы состояния
help_view.status_text=Синие иконки обозначают включённых пользователей и компьютеры. Серые — отключённые учетные записи или компьютеры.
help_view.computers_title=Компьютеры
help_view.computers_text=Откройте компьютер, чтобы посмотреть оборудование, программы, службы, процессы и производительность.
help_view.settings_title=Настройки
help_view.settings_text=Изменяйте тему, язык и значения по умолчанию для новых пользователей.
help_view.webhooks_title=Webhook-уведомления
help_view.api_tokens_title=API-токены
help_view.api_tokens_text=Создавайте интеграционные токены только с нужными правами для каталога, инвентаризации, инцидентов и удалённого управления. Укажите срок до 365 дней, сохраните секрет при создании и отзовите токен, чтобы сразу заблокировать его во всех сервисах.
help_view.webhooks_text=Настройте исходящие HTTP-уведомления для событий жизненного цикла инцидентов, пользователей и групп. При заданном секрете payload получает подпись HMAC SHA-256, а неудачные доставки повторяются три раза.
