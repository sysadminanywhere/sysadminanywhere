help_view.access_roles_title=Права доступа
help_view.access_roles_text=Каждая учётная запись AD может просматривать данные. Прямые участники Domain Admins также могут вносить изменения. Другие группы и учётную запись WMI для инвентаризации задают в настройках Directory; после изменения роли войдите заново.
