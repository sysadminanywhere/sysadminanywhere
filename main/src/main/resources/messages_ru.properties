help_view.domain_health_title=Проверка состояния домена
help_view.domain_health_text=Страница «Состояние домена» проверяет LDAP, обнаружение контроллеров домена, DNS, доступность SMB для SYSVOL/NETLOGON, расхождение времени LDAP и сертификат LDAP при включённом SSL. Предупреждение означает, что проверку не удалось подтвердить полностью, но это не обязательно означает отказ домена.
help_view.security_audit_title=Аудит безопасности
help_view.security_audit_text=Проверяйте привилегированных пользователей и группы, учётные записи с SPN, а также пользователей без email или руководителя. Стандартные атрибуты Active Directory не показывают регистрацию MFA, поэтому MFA нужно проверять в поставщике удостоверений.
