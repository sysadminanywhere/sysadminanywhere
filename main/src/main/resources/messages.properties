help_view.reports_title=Reports
help_view.reports_text=Open reports for users, computers and groups.
help_view.workflows_title=Common tasks
help_view.users_title=Users
help_view.users_text=Use filters to find users, click a row for details, or use New and Import to add accounts. Use the checkboxes for multi-selection.
help_view.import_users_title=CSV import preview
help_view.import_users_text=Upload a CSV file, review every row and its validation error, then import only the valid rows. Failed rows remain visible so they can be corrected and retried.
help_view.bulk_title=Bulk user operations
help_view.bulk_text=Select several users in the table and use Enable selected or Disable selected. Each operation requires confirmation and is reflected in the directory audit.
help_view.bulk_directory_title=Bulk operations for directory objects
help_view.bulk_directory_text=Computers support bulk enable, disable and delete. Groups, contacts, printers and supported objects in the Containers list support bulk delete. Select rows with checkboxes; a single click still opens details, and every action requires confirmation.
help_view.bulk_group_title=Bulk group membership
help_view.bulk_group_text=In the users and computers lists, select rows with checkboxes and use Add selected to group or Remove selected from group. Choose the target group and confirm the operation. Results show successful and failed objects.
help_view.bulk_move_title=Bulk move between containers
help_view.bulk_move_text=In the Containers list, select supported objects with checkboxes, choose a destination container and confirm. System and unknown object types remain protected.
help_view.audit_title=Audit history
help_view.audit_text=Use the Audit page to filter changes by object name, distinguished name, action and date. Click a row to inspect the available LDAP metadata. Active Directory does not provide the application user or historical before/after values through this audit source.
help_view.status_title=Status indicators
help_view.status_text=Blue icons indicate enabled users and computers. Gray icons indicate disabled accounts or computers.
help_view.computers_title=Computers
help_view.computers_text=Open a computer to inspect hardware, software, services, processes and performance.
help_view.licenses_title=Software licenses
help_view.licenses_text=Administrators can register purchased licenses, expiration dates and notes under Inventory → Software licenses. The table compares purchased and detected installations and allows creating an incident for expired or overused licenses.
help_view.settings_title=Settings
help_view.settings_text=Change the color theme, language and default values for new users.
help_view.webhooks_title=Webhooks
help_view.api_tokens_title=API tokens
help_view.api_tokens_text=Create integration tokens with only the directory, inventory, incident, and remote-management permissions they need. Choose an expiry up to 365 days, copy the secret when it is created, and revoke a token to block it across services immediately.
help_view.webhooks_text=Configure outbound HTTP notifications for incident, user and group lifecycle events. Payloads include an HMAC SHA-256 signature when a secret is set, and failed deliveries are retried three times.
